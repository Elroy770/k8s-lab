id: 09-daemonset
title: "DaemonSets"
intro: |
  Sometimes you need exactly one pod running on EVERY node in the cluster.
  This is what DaemonSets are for. Common use cases include:
  - Log collection daemons (fluentd, logstash)
  - Monitoring daemons (Prometheus Node Exporter)
  - Networking agents (kube-proxy, cilium, calico)
  
  Unlike Deployments which can place multiple replicas on any node, DaemonSets ensure that as nodes are added to the cluster, a copy of the specified pod is automatically added to them. When nodes are removed, the pods are garbage collected.

initialState:
  daemonSets:
    - name: fluentd-logging
  pods:
    - name: fluentd-logging-node1
      node: node1
      status: Running
    - name: fluentd-logging-node2
      node: node2
      status: Running

steps:
  - type: explanation
    text: |
      Let's see how DaemonSets operate. In a DaemonSet, there is no "replicas" field. The desired number of pods is strictly equal to the number of eligible nodes in your cluster (or a subset if node selectors are used).
    behindTheScenes: |
      The DaemonSet controller (part of the kube-controller-manager) watches the state of Nodes and DaemonSets in the API Server. 
      When a new Node is registered, it automatically creates a Pod for that node. It bypasses the normal kube-scheduler by directly assigning the `spec.nodeName` field of the Pod.

  - type: challenge
    prompt: "List the DaemonSets currently running in our cluster."
    hint: "Use `kubectl get ds` to list DaemonSets."
    expected:
      verb: get
      resource: daemonset
    behindTheScenes: "The API Server authenticates your request, checks RBAC policies, and queries etcd for all DaemonSet objects in the current namespace, formatting them for display."

  - type: challenge
    prompt: "Now list the pods. Notice that there is exactly one `fluentd-logging` pod running on each node (node1 and node2)."
    hint: "Use `kubectl get pods -o wide` to see which node each pod is running on."
    expected:
      verb: get
      resource: pod
    behindTheScenes: "Each kubelet continually reports the status of its local pods back to the API Server. If a logging pod crashes, the kubelet will automatically restart it on that same node to maintain the DaemonSet's promise."
