id: 13-configmaps
title: "ConfigMaps"
intro: |
  ConfigMaps allow you to decouple configuration artifacts from image content.
  You can inject them into your Pods as:
  1. Environment variables
  2. Command-line arguments
  3. Files in a Volume
  4. Directly from the Kubernetes API

initialState:
  configMaps:
    - name: app-config

steps:
  - type: challenge
    prompt: "Get the ConfigMaps in the cluster."
    hint: "kubectl get configmap"
    expected:
      verb: get
      resource: configmap
    behindTheScenes: "API Server reads ConfigMap definitions from etcd."

  - type: challenge
    prompt: "Describe the 'app-config' ConfigMap to see its contents."
    hint: "kubectl describe configmap app-config"
    expected:
      verb: describe
      resource: configmap
      name: app-config
    behindTheScenes: "API Server retrieves the keys and values stored in etcd for this ConfigMap."

  - type: explanation
    text: "When a Pod uses a ConfigMap as a volume, kubelet mounts it on the node and keeps it updated if the ConfigMap changes."
    behindTheScenes: "kubelet's SyncLoop detects changes to the ConfigMap, then updates the files mounted in the Pod's filesystem."
