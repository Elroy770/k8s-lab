id: deployment
title: The Deployment

intro: |
  A Deployment is the most common resource for managing applications. It provides declarative updates for Pods and ReplicaSets, allowing you to manage software versions with zero downtime.
  
  A Deployment named 'my-app' has been created. It automatically created a ReplicaSet, which in turn created 3 Pods.

steps:
  - type: challenge
    prompt: Set the image of the 'my-app' deployment to 'nginx:1.19'.
    expected:
      verb: set
      resource: deployment
      name: my-app

  - type: observation
    text: |
      The Deployment created a NEW ReplicaSet for the new image version!

  - type: explanation
    text: |
      This is a Rolling Update. The Deployment scales up the new ReplicaSet and scales down the old ReplicaSet simultaneously, ensuring there is no downtime.

  - type: challenge
    prompt: Undo the rollout (rollback) of the 'my-app' deployment.
    expected:
      verb: undo
      resource: deployment
      name: my-app

  - type: observation
    text: |
      The Deployment automatically scaled the old ReplicaSet back up and scaled down the new one!

  - type: transition
    text: |
      You now have a solid mental model of how Deployments manage ReplicaSets, and how ReplicaSets manage Pods.
