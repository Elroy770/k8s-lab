id: 04-replicaset
title: "ReplicaSets"
intro: |
  A ReplicaSet is a Kubernetes controller that ensures a specified number of identical Pod replicas are running at all times.
  It is the foundation of self-healing in Kubernetes: if a Pod dies, the ReplicaSet instantly detects the shortage and starts a new one across eligible worker nodes to replace it.
  ReplicaSets use "label selectors" (`matchLabels`) to identify and manage their target Pods.
initialState:
  replicaSets:
    - name: frontend
      replicas: 3
      image: nginx:latest
      selector:
        app: frontend
  pods:
    - name: frontend-a
      image: nginx:latest
      node: worker-node-1
      ip: 10.244.1.21
      labels:
        app: frontend
      owner: frontend
    - name: frontend-b
      image: nginx:latest
      node: worker-node-2
      ip: 10.244.2.22
      labels:
        app: frontend
      owner: frontend
    - name: frontend-c
      image: nginx:latest
      node: worker-node-1
      ip: 10.244.1.23
      labels:
        app: frontend
      owner: frontend
steps:
  - title: "Understand the ReplicaSet"
    type: observation
    text: "We have pre-provisioned a ReplicaSet named 'frontend' that is configured to maintain exactly 3 replicas balanced across worker-node-1 and worker-node-2."
    behindTheScenes: |
      - kube-controller-manager: The ReplicaSet controller continuously queries the API server: 'I desire 3 Pods matching app=frontend. I see 3 Pods. State is synchronized.'
      - kube-apiserver: Serves current cluster state to the controller manager.
      - etcd: Stores the ReplicaSet definition and the state of the 3 running Pods.
      - kubelet & CRI: Keep the 3 containers running happily on the worker nodes.

  - title: "List the Replicas Across Worker Nodes"
    type: challenge
    prompt: "List the pods to see the 3 replicas actively managed across nodes by the ReplicaSet."
    hint: "kubectl get pods -o wide (or: kubectl get rs)"
    expected:
      verb: get
      resource: pod
    behindTheScenes: |
      - kube-apiserver: Receives your request and queries the backend.
      - etcd: Fetches the data for frontend-a, frontend-b, and frontend-c.

  - title: "Simulate a Failure"
    type: challenge
    prompt: "Delete one of the pods, for example 'frontend-a', to simulate a node crash or application failure."
    hint: "kubectl delete pod frontend-a"
    expected:
      verb: delete
      resource: pod
    behindTheScenes: |
      - kube-apiserver: Marks the 'frontend-a' Pod for deletion in etcd.
      - kubelet & CRI: Terminate the 'frontend-a' container on worker-node-1.
      - kube-controller-manager: The ReplicaSet controller immediately detects Actual (2) != Desired (3) and requests a new Pod.
      - kube-scheduler: Evaluates nodes and binds the replacement Pod.
      - kubelet & CRI: Pull the image and launch the container on the target node.

  - title: "Verify Self-Healing"
    type: challenge
    prompt: "List the pods again to witness Kubernetes self-healing in action. You should see a brand new pod replacing the one you deleted."
    hint: "kubectl get pods -o wide (or: kubectl get pods)"
    expected:
      verb: get
      resource: pod
    behindTheScenes: |
      - kube-apiserver: Fetches latest cluster state from etcd.
      - etcd: Returns the list containing the surviving Pods and the freshly created replacement Pod.
      - kube-controller-manager: Satisfied as Actual (3) == Desired (3).

  - title: "Lesson Complete"
    type: transition
    text: "Great job! You have witnessed the self-healing power of ReplicaSets. In the next lesson, we will explore scaling and Deployments, which manage ReplicaSets to provide declarative rolling updates."
    behindTheScenes: |
      All core components (kube-apiserver, etcd, kube-scheduler, kube-controller-manager, kubelet, kube-proxy, and CRI) worked in harmony to restore desired state.
