id: 08-rollback
title: "Rollbacks"
intro: |
  Disaster strikes! The new 'nginx:1.19' image contains a critical bug and our application is failing.
  Because Deployments keep a history of old ReplicaSets (scaled down to 0 replicas), we have an immediate escape hatch: we can easily roll back to the previous known-good version.
  
initialState:
  deployments:
    - name: my-app
      replicas: 3
      revision: 2
  replicaSets:
    - name: my-app-old
      owner: my-app
      replicas: 0
    - name: my-app-new
      owner: my-app
      replicas: 3
  pods:
    - name: my-app-new-a
      owner: my-app-new
    - name: my-app-new-b
      owner: my-app-new
    - name: my-app-new-c
      owner: my-app-new

steps:
  - type: explanation
    text: |
      Every time a Deployment's pod template is modified, it generates a new revision. This revision history is simply the collection of old ReplicaSets associated with this Deployment.
    behindTheScenes: |
      The Deployment controller uses annotations (specifically `deployment.kubernetes.io/revision`) on the ReplicaSets to keep track of the chronological order of updates.

  - type: challenge
    prompt: "Check the rollout history of your deployment to see the available revisions."
    hint: "kubectl rollout history deployment/my-app"
    expected:
      verb: rollout
      resource: deployment
      name: my-app
    behindTheScenes: |
      The API Server queries etcd for all ReplicaSets owned by the `my-app` Deployment. The client formats and displays these based on their revision annotations.

  - type: explanation
    text: |
      Scaling a deployment does NOT trigger a new revision—only changes to the pod template (like an image update or env var change) do. Let's hit the undo button.
    behindTheScenes: |
      Because scaling just changes the `replicas` field on the Deployment (and subsequently the active ReplicaSet) without altering the pod template, no new hash or ReplicaSet is needed.

  - type: challenge
    prompt: "Undo the last rollout to quickly revert back to the previous stable revision."
    hint: "kubectl rollout undo deployment/my-app"
    expected:
      verb: rollout
      resource: deployment
      name: my-app
    behindTheScenes: |
      When you issue an undo, the API Server updates the Deployment's pod template to match the template of the previous ReplicaSet (`my-app-old`).
      The Deployment controller detects this template change. Instead of creating a new ReplicaSet, it sees that `my-app-old` already matches the desired template hash!

  - type: observation
    text: |
      Your application has been safely restored!
    behindTheScenes: |
      The Deployment controller bumps the revision number of the `my-app-old` ReplicaSet to make it the latest, and immediately executes a rolling update in reverse: scaling UP `my-app-old` and scaling DOWN the buggy `my-app-new`.
