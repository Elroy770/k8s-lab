id: 02-first-pod
title: "Your First Pod"
intro: |
  In Kubernetes, the smallest and simplest deployable object is a Pod. 
  A Pod represents a single instance of a running process in your cluster, wrapping one or more tightly coupled containers.
  You can create Pods imperatively via the CLI (`kubectl run`) or declaratively using YAML manifests (`kubectl apply -f pod.yaml`).
  Let's get our hands dirty and deploy your very first Pod!
steps:
  - title: "Create the Pod (Imperative or Declarative)"
    type: challenge
    prompt: "Create a pod named 'web' using the 'nginx' container image. You can use imperative `kubectl run` or apply declarative YAML (`kubectl apply -f pod.yaml` / `vim pod.yaml`)."
    hint: "kubectl run web --image=nginx (or: kubectl apply -f pod.yaml)"
    expected:
      verb: run
      resource: pod
      name: web
    behindTheScenes: |
      - kube-apiserver: Receives your request, authenticates RBAC, and validates the Pod specification.
      - etcd: The API server persists the new Pod object as "Pending" in etcd.
      - kube-scheduler: Evaluates available worker nodes (worker-node-1 and worker-node-2), scores resource capacity, and binds the Pod to a node.
      - kubelet: The kubelet on the assigned node reads the PodSpec from the API server watch stream.
      - CRI: Instructed by kubelet, containerd pulls the 'nginx' image and creates the container process inside dedicated Linux namespaces.

  - title: "Verify Pod Creation & Node Placement"
    type: challenge
    prompt: "List the pods in your default namespace to confirm that 'web' is Running. Use `-o wide` to discover which worker node the scheduler assigned it to."
    hint: "kubectl get pods -o wide (or: kubectl get pods)"
    expected:
      verb: get
      resource: pod
    behindTheScenes: |
      - kube-apiserver: Queries etcd for Pod status records in the default namespace.
      - etcd: Quickly retrieves the Pod IP, status, and scheduled node name.
      - kubelet: Continuously updates the API server with container runtime health.

  - title: "Discover Nodes & Inspect Pod Details"
    type: challenge
    prompt: "Inspect the 'web' pod details or discover your cluster's multi-node infrastructure."
    hint: "kubectl describe pod web (or: kubectl get nodes)"
    expected:
      verb: describe
      resource: pod
      name: web
    behindTheScenes: |
      - kube-apiserver: Aggregates Pod metadata and chronological Event objects recorded in etcd.
      - kubelet: Emits events (pulling image, created container, started container) back to the control plane.
      - kube-scheduler: Recorded the 'Scheduled' event when it bound the Pod to its host node.
      
  - title: "Wrap Up"
    type: transition
    text: "Excellent work! You have successfully created, viewed, and inspected a standalone Pod across cluster nodes. Next, we will explore the lifecycle of a standalone Pod and what happens when failure strikes."
    behindTheScenes: |
      The entire Kubernetes architecture—kube-apiserver, etcd, kube-scheduler, kubelet, and CRI—has synchronized to realize and display your desired state.
