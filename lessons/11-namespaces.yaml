id: 12-namespaces
title: "Namespaces"
intro: |
  In Kubernetes, Namespaces provide a mechanism for isolating groups of resources within a single cluster.
  Think of them as virtual clusters. They are essential for multi-tenant environments, separating teams, or splitting staging from production.
  
  By default, Kubernetes creates four initial namespaces:
  - `default`: Where your objects go if you don't specify a namespace.
  - `kube-system`: Core system components (CoreDNS, kube-proxy, control plane).
  - `kube-public`: Resources that should be publicly readable by all users.
  - `kube-node-lease`: Contains heartbeat data from nodes to determine their availability.

initialState:
  namespaces:
    - name: default
    - name: kube-system
    - name: kube-public
    - name: kube-node-lease

steps:
  - type: explanation
    text: |
      When you run a command like `kubectl get pods`, it only shows pods in the `default` namespace (or your current context's namespace).
      To see pods in a different namespace, you use the `-n` or `--namespace` flag.
    behindTheScenes: "The API Server segments API paths based on namespaces (e.g., `/api/v1/namespaces/kube-system/pods`). This allows strict Role-Based Access Control (RBAC) rules to limit user access to specific namespaces."

  - type: challenge
    prompt: "List all namespaces in the cluster."
    hint: "Use `kubectl get ns`."
    expected:
      verb: get
      resource: namespace
    behindTheScenes: "API Server reads namespace resources from etcd. Namespaces themselves are cluster-scoped, meaning they don't live inside a namespace."

  - type: explanation
    text: |
      Namespaces also provide scope for DNS. 
      When a service is created, a DNS record is generated like `<service-name>.<namespace-name>.svc.cluster.local`. 
      This allows cross-namespace communication. A pod in `default` can reach a database in `staging` by calling `database.staging`.
    behindTheScenes: "CoreDNS dynamically watches the API Server for Services and Endpoints across all namespaces to build this hierarchical DNS tree."

  - type: explanation
    text: |
      Note: Not all resources are namespaced! 
      Low-level infrastructure objects like Nodes, PersistentVolumes (PVs), and ClusterRoles exist globally across the entire cluster.
    behindTheScenes: "The API Server distinguishes between namespaced and non-namespaced resources using its internal API discovery documents, which dictate how objects are stored and accessed."
