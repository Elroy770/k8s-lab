id: 07-rolling-update
title: "Rolling Updates"
intro: |
  It's time to release version 1.19 of our application! 
  Because we are using a Deployment, we can leverage its default "RollingUpdate" strategy. 
  Instead of stopping all old pods at once (which causes downtime), a rolling update gradually creates pods for the new version while terminating pods of the old version across worker nodes, ensuring zero downtime.
  
initialState:
  deployments:
    - name: my-app
      replicas: 3
      image: nginx:1.18
  replicaSets:
    - name: my-app-old
      owner: my-app
      image: nginx:1.18
      replicas: 3
  pods:
    - name: my-app-old-a
      image: nginx:1.18
      node: worker-node-1
      ip: 10.244.1.41
      owner: my-app-old
    - name: my-app-old-b
      image: nginx:1.18
      node: worker-node-2
      ip: 10.244.2.42
      owner: my-app-old
    - name: my-app-old-c
      image: nginx:1.18
      node: worker-node-1
      ip: 10.244.1.43
      owner: my-app-old

steps:
  - type: explanation
    text: |
      Rolling updates are controlled by two parameters: `maxSurge` (how many extra pods can be created above desired count) and `maxUnavailable` (how many pods can be offline during the update). 
      Let's trigger an update by updating the container image imperatively (`kubectl set image`) or declaratively (`vim deployment.yaml` + `kubectl apply -f deployment.yaml`).
    behindTheScenes: |
      The Deployment controller is watching the `my-app` Deployment. Currently, it sees that actual state (managed by `my-app-old` ReplicaSet) matches desired state.

  - type: challenge
    prompt: "Update the 'my-app' deployment to use the new 'nginx:1.19' image via `kubectl set image` or by applying `deployment.yaml`."
    hint: "kubectl set image deployment/my-app nginx=nginx:1.19 (or: kubectl apply -f deployment.yaml)"
    expected:
      verb: set
      resource: deployment
      name: my-app
    behindTheScenes: |
      Your command updates the pod template in the Deployment spec in etcd.
      The Deployment controller detects this change. It hashes the new template and creates a BRAND NEW ReplicaSet (`my-app-v2`) with 0 desired replicas initially.

  - type: observation
    text: |
      The rollout has begun! The deployment is managing two ReplicaSets simultaneously to transition smoothly across worker-node-1 and worker-node-2.
    behindTheScenes: |
      The Deployment controller orchestrates a rolling update:
      1. It scales UP the new ReplicaSet by `maxSurge` (+1 pod).
      2. It waits for the new pod to become ready.
      3. It scales DOWN the old ReplicaSet by `maxUnavailable` (-1 pod).
      This cycle repeats until the new ReplicaSet has 3 replicas and the old one has 0.

  - type: challenge
    prompt: "Check the rollout status of your deployment to watch the progress."
    hint: "kubectl rollout status deployment/my-app"
    expected:
      verb: rollout
      resource: deployment
      name: my-app
    behindTheScenes: |
      The `rollout status` command watches the Deployment's status field until available replicas matches the desired replicas and old ReplicaSet is fully scaled down.

  - type: explanation
    text: |
      By the end of the rollout, your application has been completely updated without a single dropped request! 
      Contrast this with the 'Recreate' strategy, which terminates all old pods before creating new ones, causing noticeable downtime.
    behindTheScenes: |
      The old ReplicaSet is NOT deleted. It is kept around with 0 replicas as a snapshot, which is exactly how Deployments enable instantaneous zero-downtime rollbacks!
