id: 10-statefulset
title: "StatefulSets"
intro: |
  Deployments are perfect for stateless apps where pods are identical and interchangeable. 
  But what about databases or messaging queues that need stable identities and persistent data?
  
  StatefulSets provide:
  - Ordered, graceful deployment and scaling (0, 1, 2...)
  - Stable, unique network identifiers (e.g., mysql-0, mysql-1)
  - Persistent storage matching that follows the pod even if it moves nodes
  - Headless services to directly address individual pods

initialState:
  statefulSets:
    - name: mysql
  pods:
    - name: mysql-0
      status: Running
    - name: mysql-1
      status: Running
    - name: mysql-2
      status: Running

steps:
  - type: explanation
    text: |
      Unlike Deployment pods which get random hashes (e.g., `webapp-7d9g5`), StatefulSet pods get sticky, predictable ordinal names (`mysql-0`, `mysql-1`).
      This makes it easy for applications to discover peers, like setting up a database primary-replica cluster.
    behindTheScenes: "The StatefulSet controller creates pods sequentially. It will wait for `mysql-0` to be Ready before creating `mysql-1`, ensuring safe initialization for stateful workloads."

  - type: challenge
    prompt: "List the StatefulSets in the cluster."
    hint: "Use `kubectl get sts` to list StatefulSets."
    expected:
      verb: get
      resource: statefulset
    behindTheScenes: "The API Server retrieves the StatefulSet object, showing the desired and ready replicas. Behind the scenes, the controller constantly reconciles the actual state to match the desired state."

  - type: challenge
    prompt: "List the pods and observe their ordered names (`mysql-0`, `mysql-1`, `mysql-2`)."
    hint: "Use `kubectl get pods`."
    expected:
      verb: get
      resource: pod
    behindTheScenes: |
      If you scale down the StatefulSet, it will terminate pods in reverse order (2, then 1, then 0). 
      This strict ordering guarantees that data replication processes can shut down cleanly without data loss.
      
  - type: explanation
    text: |
      StatefulSets also rely on a "Headless Service" (a service with `clusterIP: None`). 
      This creates specific DNS entries for each pod, meaning you can directly connect to `mysql-0.mysql.default.svc.cluster.local`.
    behindTheScenes: "The Endpoints controller watches the Headless Service and creates A/AAAA DNS records in CoreDNS for each individual pod, allowing stable network routing."

  - type: explanation
    text: |
      Storage is sticky! Each pod gets its own dedicated PersistentVolume. 
      If `mysql-1` is deleted and rescheduled to a new node, it reconnects to its exact same volume.
    behindTheScenes: "The controller dynamically creates PersistentVolumeClaims (PVCs) from a `volumeClaimTemplate`. Once created, a PVC is permanently bound to that specific pod index, even across restarts."
