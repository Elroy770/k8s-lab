id: first-pod
title: What is a Pod?

intro: |
  Pods are the smallest deployable units of computing that you can create and manage in Kubernetes.
  A Pod is a group of one or more containers, with shared storage and network resources.
  
  Let's start by creating a standalone Pod running the nginx image.

steps:
  - type: challenge
    prompt: Run an nginx Pod named 'web'.
    expected:
      verb: run
      resource: pod
      name: web

  - type: observation
    text: |
      Excellent! The Pod 'web' is now running on a worker node.

  - type: transition
    text: |
      Now let's see what happens if this Pod experiences a failure.
