id: first-pod
chapter: Workloads
title: The Smallest Thing You Can Run
concept: Pod

intro: |
  You have a cluster and nothing running on it.

  A Pod is the smallest thing Kubernetes will schedule for you. It wraps one
  container (sometimes a few) and gives it an IP address on a node.

  Let's put something on this cluster and see where it lands.

steps:
  - type: challenge
    prompt: Look at the machines you have to work with.
    hint: kubectl get nodes
    expected:
      verb: get
      resource: nodes
    reveal: One control plane, two workers. Your workloads run on the workers.

  - type: challenge
    prompt: Start a Pod called `web` running the image `nginx:1.21`.
    hint: kubectl run web --image=nginx:1.21
    expected:
      verb: run
      name: web
      flags:
        image: true
    reveal: The API server accepted your object. The scheduler picked a node.

  - type: challenge
    prompt: Check whether it is actually running yet.
    hint: kubectl get pods
    expected:
      verb: get
      resource: pods
    reveal: Pending → ContainerCreating → Running. Creation is not instant.

  - type: explanation
    text: |
      Nothing here happened in one step.

      `kubectl` only wrote your wish into the API server. The scheduler then
      chose a node, and the kubelet on that node pulled the image and started
      the container. You watched the status catch up with reality.

  - type: transition
    text: |
      You have a running Pod. Before we break it, let's look at it closely.
