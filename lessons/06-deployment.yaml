id: 06-deployment
title: "Deployments"
intro: |
  ReplicaSets are great for self-healing and scaling, but what happens when you need to release a new version of your application? 
  If you just change the pod template in a ReplicaSet, it won't restart existing pods. You'd have to manually delete them to force replacements, causing downtime!
  To solve this, Kubernetes provides the Deployment resource. A Deployment manages ReplicaSets, enabling declarative updates (`vim deployment.yaml` + `kubectl apply -f deployment.yaml`), rolling rollouts, and rollbacks.
  
initialState:
  deployments:
    - name: my-app
      replicas: 3
      image: nginx:latest
  replicaSets:
    - name: my-app-7bf4d5
      owner: my-app
      image: nginx:latest
      replicas: 3
  pods:
    - name: my-app-7bf4d5-a
      image: nginx:latest
      node: worker-node-1
      ip: 10.244.1.31
      owner: my-app-7bf4d5
    - name: my-app-7bf4d5-b
      image: nginx:latest
      node: worker-node-2
      ip: 10.244.2.32
      owner: my-app-7bf4d5
    - name: my-app-7bf4d5-c
      image: nginx:latest
      node: worker-node-1
      ip: 10.244.1.33
      owner: my-app-7bf4d5

steps:
  - type: explanation
    text: |
      A Deployment is a higher-level abstraction. When you create a Deployment, it doesn't create Pods directly; instead, it creates a ReplicaSet, which in turn manages the Pods across worker nodes. This layered approach is what enables seamless updates.
    behindTheScenes: |
      The Deployment controller (inside kube-controller-manager) watches Deployment objects. 
      When you define a Deployment, it calculates a hash of the pod template and creates a ReplicaSet with that hash in its name. The ReplicaSet controller then takes over to create the Pods.

  - type: challenge
    prompt: "List the deployments to inspect the 'my-app' deployment (or apply `deployment.yaml`)."
    hint: "kubectl get deployment (or: kubectl apply -f deployment.yaml)"
    expected:
      verb: get
      resource: deployment
    behindTheScenes: |
      The API server queries etcd for Deployment objects. The Deployment status tracks the total, updated, ready, and available replicas by summarizing the status of its underlying ReplicaSets.

  - type: challenge
    prompt: "List the ReplicaSets to see the one automatically created and managed by the deployment."
    hint: "kubectl get rs"
    expected:
      verb: get
      resource: replicaset
    behindTheScenes: |
      The API server retrieves ReplicaSets. Notice the RS name is the deployment name appended with a pod-template-hash (e.g., my-app-7bf4d5). This hash is crucial for tracking which ReplicaSet corresponds to which application version.

  - type: challenge
    prompt: "List the pods with `-o wide` to see them running under the ReplicaSet's control across worker nodes."
    hint: "kubectl get pods -o wide (or: kubectl get pods)"
    expected:
      verb: get
      resource: pod
    behindTheScenes: |
      The API server retrieves Pods. By examining their `ownerReferences`, you can trace the hierarchy: Pod -> ReplicaSet -> Deployment. If a Pod dies, the ReplicaSet replaces it; if the template changes, the Deployment orchestrates a new ReplicaSet.
