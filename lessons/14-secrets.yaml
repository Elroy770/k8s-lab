id: 14-secrets
title: "Secrets"
intro: |
  Secrets let you store and manage sensitive information, such as passwords, OAuth tokens, and ssh keys.
  Storing confidential information in a Secret is safer and more flexible than putting it verbatim in a Pod definition or in a container image.

initialState:
  secrets:
    - name: db-credentials

steps:
  - type: explanation
    text: |
      Types of Secrets include:
      - Opaque: arbitrary user-defined data
      - kubernetes.io/dockerconfigjson: for docker registry credentials
      - kubernetes.io/tls: for TLS certificates
    behindTheScenes: "The API Server validates the structure depending on the Secret type."

  - type: challenge
    prompt: "List the secrets in the cluster."
    hint: "kubectl get secrets"
    expected:
      verb: get
      resource: secret
    behindTheScenes: "API Server fetches Secret metadata from etcd."

  - type: explanation
    text: |
      WARNING: By default, Secrets are stored UNENCRYPTED (base64 encoded) in etcd!
      Mitigation strategies:
      - Enable Encryption at Rest in the API Server.
      - Use external secret management systems (like HashiCorp Vault or AWS Secrets Manager) and inject them using CSI drivers.
    behindTheScenes: "If EncryptionConfiguration is passed to the API Server, it will encrypt the secret payload before writing to etcd, and decrypt upon reading."
