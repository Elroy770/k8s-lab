id: secrets
chapter: Configuration
title: Secrets Are Not Encryption
concept: Secret

intro: |
  A Secret looks exactly like a ConfigMap, with one difference: the API server
  keeps its values out of logs and out of `describe` output.

  Base64 is not encryption. Understanding that is the whole lesson.

files:
  db.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: api
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: api
      template:
        metadata:
          labels:
            app: api
        spec:
          containers:
            - name: app
              image: nginx:1.21
              envFrom:
                - secretRef:
                    name: db-creds
              volumeMounts:
                - name: creds
                  mountPath: /etc/creds
          volumes:
            - name: creds
              secret:
                secretName: db-creds

steps:
  - type: challenge
    prompt: Create a generic Secret called `db-creds` with `username=admin` and `password=s3cr3t`.
    hint: kubectl create secret generic db-creds --from-literal=username=admin --from-literal=password=s3cr3t
    expected:
      verb: create
      subcommand: secret
      name: db-creds

  - type: challenge
    prompt: List the Secrets.
    hint: kubectl get secrets
    expected:
      verb: get
      resource: secrets
    reveal: You see the key count and the type - never the values.

  - type: challenge
    prompt: Describe it and notice what is deliberately missing.
    hint: kubectl describe secret db-creds
    expected:
      verb: describe
      resource: secrets
      name: db-creds
    reveal: Only byte counts. describe refuses to print Secret values.

  - type: challenge
    prompt: Deploy the API that consumes the Secret.
    hint: kubectl apply -f db.yaml
    expected:
      verb: apply
      flags:
        filename: db.yaml

  - type: challenge
    prompt: Read the password from inside the Pod.
    hint: "kubectl exec <paste-a-pod-name> -- cat /etc/creds/password"
    expected:
      verb: exec
      contains: password
    reveal: Plain text, instantly. Anyone with exec rights has your password.

  - type: explanation
    text: |
      What a Secret actually gives you:

      - values are kept out of `describe`, events and most log output
      - they are stored separately from the workload definition
      - RBAC can allow reading a Deployment while denying the Secret

      What it does not give you: encryption. By default the value is only
      base64-encoded in etcd, and any process inside the Pod can read it.

      Real protection comes from encryption at rest, RBAC, and external secret
      stores. Never commit Secret manifests with real values to git.

  - type: transition
    text: |
      You have now typed a lot of imperative commands. Time to stop typing and
      start declaring.
